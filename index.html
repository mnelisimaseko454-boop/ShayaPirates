<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaya Pirates</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://js.onclckvd.com/in-stream-ad-admanager/tma.js"></script>
<script src="https://giga.pub/sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;padding:8px;padding-bottom:80px;font-family:Georgia,serif}
.hidden{display:none!important}
.wrap{position:relative;width:100%}
.wrap img{width:100%;display:block;border-radius:18px;background:#EDE6CC;min-height:120px}
.num{position:absolute;font-weight:900;color:#111;font-family:Georgia,serif;text-shadow:0 1px 0 #fff, 0 0 4px #fff;z-index:2}
.btn{position:absolute;background:transparent;border:none;cursor:pointer;z-index:3}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;display:flex;justify-content:space-around;padding:10px;color:#777;border-top:1px solid #333;z-index:99}
.nav div{text-align:center;font-size:12px}
.nav div.active{color:#FFD700}
</style></head><body>

<!-- ===== HEADER ===== -->
<div class="wrap">
  <img src="header.jpg">
  <div class="num" id="bal" style="left:22%;top:32%;font-size:24px">3.4609</div>
  <div class="num" id="dailyIncomeTop" style="left:62%;top:86%;font-size:22px">+291.00</div>
  <button class="btn" style="left:3%;top:52%;width:22%;height:18%" onclick="showPage('pirates')"></button>
  <button class="btn" style="left:27%;top:52%;width:22%;height:18%" onclick="showPage('deposit')"></button>
  <button class="btn" style="left:51%;top:52%;width:22%;height:18%" onclick="showPage('withdraw')"></button>
  <button class="btn" style="left:75%;top:52%;width:22%;height:18%" onclick="showPage('partners')"></button>
  <button class="btn" style="left:84%;top:5%;width:14%;height:22%" onclick="showPage('profile')"></button>
</div>

<!-- ===== PIRATES PAGE ===== -->
<div id="page-pirates">
  <div class="wrap" style="margin-top:10px">
    <img src="parrot-card.jpg">
    <div class="num" id="crewCount" style="left:50%;top:68%;transform:translateX(-50%);font-size:22px">18</div>
    <div class="num" id="pending" style="left:50%;top:76%;transform:translateX(-50%);font-size:20px">17.8145</div>
    <button class="btn" style="left:6%;bottom:2%;width:88%;height:11%" onclick="collectWithAd()"></button>
  </div>

  <div class="wrap" style="margin-top:10px"><img src="crew-grid.jpg"></div>

  <h3 style="color:#FFD700;margin:14px 4px">☠️ PIRATE TAVERN & RECRUITS</h3>

  <div class="wrap"><img src="tavern-1.jpg">
    <button class="btn" style="left:5%;top:44%;width:42%;height:9%" onclick="openRecruit('deckhand')"></button>
    <button class="btn" style="left:53%;top:44%;width:42%;height:9%" onclick="openRecruit('powder')"></button>
    <button class="btn" style="left:5%;top:94%;width:42%;height:5%" onclick="openRecruit('buccaneer')"></button>
    <button class="btn" style="left:53%;top:94%;width:42%;height:5%" onclick="openRecruit('swash')"></button>
  </div>
  <div class="wrap" style="margin-top:10px"><img src="tavern-2.jpg">
    <button class="btn" style="left:5%;top:44%;width:42%;height:9%" onclick="openRecruit('corsair')"></button>
    <button class="btn" style="left:53%;top:44%;width:42%;height:9%" onclick="openRecruit('gunner')"></button>
    <button class="btn" style="left:5%;top:94%;width:42%;height:5%" onclick="openRecruit('navigator')"></button>
    <button class="btn" style="left:53%;top:94%;width:42%;height:5%" onclick="openRecruit('quarter')"></button>
  </div>
  <div class="wrap" style="margin-top:10px"><img src="tavern-3.jpg">
    <button class="btn" style="left:5%;top:44%;width:42%;height:9%" onclick="openRecruit('mate')"></button>
    <button class="btn" style="left:53%;top:44%;width:42%;height:9%" onclick="openRecruit('captain')"></button>
    <button class="btn" style="left:5%;top:94%;width:42%;height:5%" onclick="openRecruit('dread')"></button>
    <button class="btn" style="left:53%;top:94%;width:42%;height:5%" onclick="openRecruit('king')"></button>
  </div>
</div>

<!-- ===== DEPOSIT ===== -->
<div id="page-deposit" class="hidden">
  <div class="wrap"><img src="deposit.jpg">
    <button class="btn" style="left:4%;top:18%;width:92%;height:12%" onclick="selectDeposit('GRAM')"></button>
    <button class="btn" style="left:4%;top:32%;width:92%;height:12%" onclick="selectDeposit('TRX')"></button>
    <button class="btn" style="left:4%;top:46%;width:92%;height:12%" onclick="selectDeposit('USDT (BEP20)')"></button>
    <button class="btn" style="left:4%;top:60%;width:92%;height:12%" onclick="selectDeposit('BNB (BEP20)')"></button>
    <button class="btn" style="left:4%;top:74%;width:92%;height:12%" onclick="selectDeposit('USDT (TRC20)')"></button>
    <button class="btn" style="left:4%;top:88%;width:92%;height:12%" onclick="selectDeposit('USDT (TON)')"></button>
  </div>
  <div style="background:#EDE6CC;border-radius:14px;padding:12px;margin-top:10px">
    <input id="depTxId" placeholder="Paste TxID / Hash" style="width:100%;padding:12px;border-radius:10px;border:2px solid #8a7a5a;margin-bottom:8px">
    <input id="depGold" type="number" placeholder="Gold e.g. 50000" style="width:100%;padding:12px;border-radius:10px;border:2px solid #8a7a5a;margin-bottom:8px">
    <button onclick="verifyDeposit()" style="width:100%;padding:13px;border-radius:999px;background:#FFD700;font-weight:900">🔍 SEND TO ADMIN</button>
    <p id="depMsg"></p>
  </div>
</div>

<!-- ===== WITHDRAW ===== -->
<div id="page-withdraw" class="hidden">
  <div class="wrap"><img src="withdraw.jpg">
    <button class="btn" style="left:4%;top:18%;width:92%;height:12%" onclick="selectWithdraw('GRAM')"></button>
    <button class="btn" style="left:4%;top:32%;width:92%;height:12%" onclick="selectWithdraw('TRX')"></button>
    <button class="btn" style="left:4%;top:46%;width:92%;height:12%" onclick="selectWithdraw('USDT (BEP20)')"></button>
    <button class="btn" style="left:4%;top:60%;width:92%;height:12%" onclick="selectWithdraw('BNB (BEP20)')"></button>
    <button class="btn" style="left:4%;top:74%;width:92%;height:12%" onclick="selectWithdraw('USDT (TRC20)')"></button>
    <button class="btn" style="left:4%;top:88%;width:92%;height:12%" onclick="selectWithdraw('USDT (TON)')"></button>
  </div>
  <div style="background:#EDE6CC;border-radius:14px;padding:12px;margin-top:10px">
    <input id="wWallet" placeholder="Wallet address" style="width:100%;padding:12px;border-radius:10px;border:2px solid #8a7a5a;margin-bottom:8px">
    <input id="wAmount" type="number" placeholder="Gold e.g. 10000" style="width:100%;padding:12px;border-radius:10px;border:2px solid #8a7a5a;margin-bottom:8px">
    <button onclick="doWithdraw()" style="width:100%;padding:13px;border-radius:999px;background:#FFD700;font-weight:900">✅ REQUEST WITHDRAWAL</button>
    <p id="wMsg"></p>
  </div>
</div>

<!-- ===== PARTNERS ===== -->
<div id="page-partners" class="hidden">
  <div class="wrap"><img src="partners.jpg">
    <div class="num" id="pendingPartnersText" style="left:30%;top:5%;font-size:26px">0</div>
    <div class="num" id="pCount" style="left:22%;top:62%;font-size:28px">0</div>
    <div class="num" id="pIncome" style="left:72%;top:62%;font-size:26px">0</div>
    <button class="btn" style="left:72%;top:2%;width:26%;height:10%" onclick="collectWithAd()"></button>
    <button class="btn" style="left:72%;top:16%;width:26%;height:10%" onclick="copyRef()"></button>
  </div>
  <input id="refLink" readonly value="https://t.me/ShayaPiratesBot?start=ref_" style="width:100%;margin-top:8px;padding:10px;border-radius:10px">
</div>

<!-- ===== PROFILE ===== -->
<div id="page-profile" class="hidden">
  <div class="wrap"><img src="profile.jpg">
    <div class="num" id="pName" style="left:50%;top:27%;transform:translateX(-50%);font-size:32px">MNELISI</div>
    <div class="num" id="pId" style="left:50%;top:34%;transform:translateX(-50%);font-size:18px">ID: 1159481047</div>
    <div class="num" id="prBal" style="left:25%;top:57%;transform:translateX(-50%);font-size:26px">3.46</div>
    <div class="num" id="prTotal" style="left:75%;top:57%;transform:translateX(-50%);font-size:26px">1,273.46</div>
    <div class="num" id="prDaily" style="left:25%;top:75%;transform:translateX(-50%);font-size:26px">+291.00</div>
    <div class="num" id="prCrew" style="left:75%;top:75%;transform:translateX(-50%);font-size:26px">18</div>
    <button class="btn" style="left:4%;top:40%;width:44%;height:8%" onclick="alert('Guide: Hire 10 pirates -> 14 days -> Watch ad -> COLLECT -> Withdraw')"></button>
    <button class="btn" style="left:52%;top:40%;width:44%;height:8%" onclick="alert('Language: English')"></button>
  </div>
  <div id="txList" style="background:#EDE6CC;border-radius:14px;padding:12px;margin-top:10px">No transaction records found.</div>
</div>

<div class="nav">
  <div class="active" onclick="showPage('pirates')">🏴‍☠️<br>Pirates</div>
  <div onclick="showPage('deposit')">💰<br>Deposit</div>
  <div onclick="showPage('withdraw')">💸<br>Withdraw</div>
  <div onclick="showPage('partners')">👥<br>Partners</div>
</div>

<script>
let tgUser=null; try{tgUser=window.Telegram?.WebApp?.initDataUnsafe?.user||null}catch(e){}
let userId=tgUser?String(tgUser.id):(localStorage.getItem('shaya_pirate_id')||'web_'+Math.random().toString(36).slice(2,8));
let userName=tgUser?(tgUser.first_name||'Captain'):'Captain';
let user={balance:3.46,pending:17.81,dailyIncome:291,crew:[],totalLooted:1273.46,partners:0,partnerIncome:0,tx:[]};
let selDep='GRAM', selWd='GRAM', selectedPirate=null;
function showPage(p){['pirates','deposit','withdraw','partners','profile'].forEach(x=>document.getElementById('page-'+x).classList.toggle('hidden',x!==p)); document.querySelectorAll('.nav div').forEach(d=>d.classList.remove('active'))}
async function loadUser(){ try{ const r=await fetch('/api/pirate/user/'+userId); user=await r.json(); }catch(e){} 
  document.getElementById('bal').innerText=Number(user.balance||0).toFixed(4);
  document.getElementById('dailyIncomeTop').innerText='+'+Number(user.dailyIncome||0).toFixed(2);
  document.getElementById('pending').innerText=Number(user.pending||0).toFixed(4);
  document.getElementById('pendingPartnersText').innerText=Number(user.pending||0).toFixed(0);
  document.getElementById('crewCount').innerText=(user.crew||[]).reduce((a,c)=>a+c.count,0);
  document.getElementById('pCount').innerText=user.partners||0;
  document.getElementById('pIncome').innerText=Number(user.partnerIncome||0).toFixed(0);
  document.getElementById('prBal').innerText=Number(user.balance||0).toFixed(2);
  document.getElementById('prTotal').innerText=Number(user.totalLooted||0).toLocaleString(undefined,{minimumFractionDigits:2});
  document.getElementById('prDaily').innerText='+'+Number(user.dailyIncome||0).toFixed(2);
  document.getElementById('prCrew').innerText=(user.crew||[]).reduce((a,c)=>a+c.count,0);
  document.getElementById('pName').innerText=userName.toUpperCase();
  document.getElementById('pId').innerText='ID: '+userId;
  document.getElementById('refLink').value='https://t.me/ShayaPiratesBot?start=ref_'+userId;
}
function selectDeposit(m){ selDep=m; alert('Deposit method: '+m+'\nNow paste TxID below'); }
function selectWithdraw(m){ selWd=m; alert('Withdraw method: '+m+'\nNow enter wallet + amount below'); }
function openRecruit(id){ selectedPirate=id; if(confirm('Recruit '+id+'? Ad will play, then pirate joins.')) confirmRecruitWithAd(); }
async function showDualAd(){ try{ if(window.showGiga) await window.showGiga('main'); }catch(e){} return true; }
async function confirmRecruitWithAd(){ await showDualAd(); const r=await fetch('/api/pirate/hire',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,name:userName,pirateId:selectedPirate})}); const d=await r.json(); alert(d.msg); loadUser(); }
async function collectWithAd(){ await showDualAd(); const r=await fetch('/api/pirate/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId})}); const d=await r.json(); alert(d.msg); loadUser(); }
async function doWithdraw(){ const wallet=document.getElementById('wWallet').value; const amount=Number(document.getElementById('wAmount').value); const r=await fetch('/api/pirate/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,name:userName,method:selWd,wallet,amount})}); const d=await r.json(); document.getElementById('wMsg').innerText=d.msg||d.error; loadUser(); }
async function verifyDeposit(){ const txId=document.getElementById('depTxId').value; const amountGold=Number(document.getElementById('depGold').value); const r=await fetch('/api/pirate/deposit-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,name:userName,method:selDep,txId,amountGold})}); const d=await r.json(); document.getElementById('depMsg').innerText=d.msg||d.error; }
function copyRef(){ navigator.clipboard.writeText(document.getElementById('refLink').value); alert('Copied!'); }
if(window.Telegram?.WebApp){ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
loadUser();
</script></body></html>
